name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEON_AUTH_URL: https://example.com/auth
          NEON_AUTH_JWKS_URL: https://example.com/.well-known/jwks.json
          NEON_AUTH_COOKIE_SECRET: 01234567890123456789012345678901
          NEXT_PUBLIC_NEON_AUTH_URL: https://example.com/auth
